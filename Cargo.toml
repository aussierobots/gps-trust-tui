[package]
name = "gps-trust-mcp-tui"
version = "0.4.9"
edition = "2024"

[[bin]]
name = "gttui"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
turul-mcp-client = "0.4.7"
tokio = { version = "1", features = ["full"] }
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.13", features = ["json", "form"] }
sha2 = "0.11"
base64 = "0.23"
rand = "0.10"
dirs = "7.0"
open = "5"
anyhow = "1.0"
form_urlencoded = "1.2"
toml = "1.2"
serde_yml = "0.0.13"  # maintained fork of the archived serde_yaml — do not "migrate back"
toon-format = "0.7"

[dev-dependencies]
gt-data-layout = { path = "../gps-trust-common/gt-data-layout" }
# In-process 2026-07-28 server for the lane tests.
turul-mcp-server = { version = "0.4", features = ["dynamic-tools"] }
turul-mcp-derive = "0.4"
turul-rpc = { version = "0.2", default-features = false }
async-trait = "0.1"

[profile.dev]
# Full DWARF debug info per crate is the main driver of target/ size in a
# large multi-binary workspace. line-tables-only keeps panic backtraces and
# line numbers usable while dropping per-variable debug data.
debug = "line-tables-only"
